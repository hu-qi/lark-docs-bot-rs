# Persistent single-node HTTPS deployment. Never commit .env.production.
services:
  lark-docs:
    # Prebuilt in GitHub Actions, pinned by the deploy workflow (no Rust compilation on ECS).
    image: ${APP_IMAGE:-ghcr.io/hu-qi/lark-docs-bot-rs:main}
    restart: unless-stopped
    env_file: .env.production
    expose:
      - "3000"
    volumes:
      - lark-docs-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      lark-docs:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
volumes:
  lark-docs-data:
  caddy-data:
  caddy-config:

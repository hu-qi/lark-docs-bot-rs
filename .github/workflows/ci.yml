name: Rust CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all
      - run: cargo build --locked --release
      - run: cargo build --locked --bin lark-docs-bot-rs
      - run: bash scripts/mcp-smoke.sh
      - run: node scripts/web-editor-test.cjs
      - name: Validate production Compose topology
        run: |
          cp deploy/env.production.example .env.production
          docker compose -f compose.prod.yaml --env-file .env.production config --quiet
          rm -f .env.production
      - name: Validate Caddy HTTPS configuration
        run: |
          docker run --rm -e SITE_DOMAIN=docs.example.com -e ACME_EMAIL=admin@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lark-docs-bot-rs:ci .

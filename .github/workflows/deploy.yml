name: Deploy to production host
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm a production rollout'
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: lark-docs-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check deployment credentials
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for variable in DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing required GitHub Actions secret: $variable"
              exit 1
            fi
          done
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS is required to pin the verified SSH server key. Obtain it from a trusted host console; do not disable host-key checking."
            exit 1
          fi
      - name: Install SSH password helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass
      - name: Prepare pinned SSH host keys
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Package the audited GitHub commit
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/lark-source.tar.gz" "$GITHUB_SHA"
          sha256sum "$RUNNER_TEMP/lark-source.tar.gz"
      - name: Fetch matching prebuilt image (retry until publish is available)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${COMMIT:0:7}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for attempt in $(seq 1 15); do
            if docker pull "$image"; then break; fi
            if [ "$attempt" -eq 15 ]; then
              echo "::error::Prebuilt image $image unavailable. Check Publish container image workflow and GHCR package permissions."
              exit 1
            fi
            echo "Waiting for GHCR image $image (attempt $attempt/15)"
            sleep 20
          done
          echo "APP_IMAGE=$image" >> "$GITHUB_ENV"
          # Ship all runtime images so the ECS need not reach GHCR or Docker Hub.
          docker pull caddy:2-alpine
          docker pull alpine:3.20
          docker save "$image" caddy:2-alpine alpine:3.20 | gzip -1 > "$RUNNER_TEMP/lark-image.tar.gz"
          sha256sum "$RUNNER_TEMP/lark-image.tar.gz"
      - name: Upload source archive to ECS (no server GitHub access required)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          remote_archive="/tmp/lark-docs-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          remote_image="/tmp/lark-docs-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          sshpass -e scp -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$RUNNER_TEMP/lark-source.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$remote_archive"
          sshpass -e scp -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$RUNNER_TEMP/lark-image.tar.gz" "$DEPLOY_USER@$DEPLOY_HOST:$remote_image"
      - name: Deploy uploaded revision with password authentication
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          COMMIT: ${{ github.sha }}
        run: |
          remote_archive="/tmp/lark-docs-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          archive_sha="$(sha256sum "$RUNNER_TEMP/lark-source.tar.gz" | cut -d' ' -f1)"
          image_sha="$(sha256sum "$RUNNER_TEMP/lark-image.tar.gz" | cut -d' ' -f1)"
          remote_image="/tmp/lark-docs-image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          # Avoid passing shell-sensitive path values through remote SSH argument parsing.
          if [ -n "$DEPLOY_PATH" ] && [[ ! "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]]; then
            echo "::error::DEPLOY_PATH must be an absolute path with no spaces or shell metacharacters"
            exit 2
          fi
          sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" sh -s -- "${DEPLOY_PATH:-__DEFAULT__}" "$COMMIT" "$remote_archive" "$archive_sha" "$remote_image" "$image_sha" "$APP_IMAGE" <<'REMOTE_SCRIPT'
          set -eu
          if [ "$1" != "__DEFAULT__" ]; then
            cd "$1"
          else
            cd "$HOME/lark-docs-bot-rs"
          fi
          test -s .env.production || { echo "Missing .env.production: configure production secrets on the server first" >&2; exit 2; }
          test -f compose.prod.yaml || { echo "Missing compose.prod.yaml in deployment directory" >&2; exit 2; }
          printf '%s  %s\n' "$4" "$3" | sha256sum -c -
          # The source archive contains tracked files only; .git, .env.production
          # and the backups directory are not overwritten.
          tar -xzf "$3" -C .
          rm -f "$3"
          printf '%s  %s\n' "$6" "$5" | sha256sum -c -
          docker load -i "$5"
          rm -f "$5"
          APP_IMAGE="$7"
          export APP_IMAGE
          docker image inspect "$APP_IMAGE" >/dev/null
          bash deploy/preflight.sh .env.production
          bash deploy/backup.sh "$(pwd)/backups"
          docker compose --env-file .env.production -f compose.prod.yaml up -d --no-build
          printf '%s\n' "$2" > .deployed-revision
          docker compose --env-file .env.production -f compose.prod.yaml ps
          REMOTE_SCRIPT
      - name: Deployment handoff
        run: |
          echo 'Deploy command completed. Confirm public HTTPS /health and a permitted Feishu document read.'

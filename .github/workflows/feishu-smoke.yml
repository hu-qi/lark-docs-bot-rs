name: Feishu API Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      test_delete:
        description: 'Delete one text block in a newly created disposable test document'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: feishu-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check configured credentials
        env:
          LARK_APP_ID: ${{ secrets.APPID }}
          LARK_APP_SECRET: ${{ secrets.APPSECRET }}
        run: |
          if [ -z "$LARK_APP_ID" ] || [ -z "$LARK_APP_SECRET" ]; then
            echo "::error::Configure repository secrets APPID and APPSECRET first"
            exit 1
          fi
      - name: Test Feishu document CRUD on disposable document
        env:
          LARK_APP_ID: ${{ secrets.APPID }}
          LARK_APP_SECRET: ${{ secrets.APPSECRET }}
          FEISHU_TEST_DELETE: ${{ inputs.test_delete }}
        run: cargo run --bin feishu-smoke
